version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
    timezone: Europe/London
  cooldown:
    default-days: 7
  groups:
    datatables:
      patterns:
        - "*datatables*"
  open-pull-requests-limit: 10
  allow:
    - dependency-type: "all"
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
    timezone: Europe/London
  cooldown:
    default-days: 7
  groups:
    aws:
      patterns:
        - "aws-*"
    dotenv:
      patterns:
        - "dotenv*"
    rails:
      patterns:
        - "rails"
        - "action*"
        - "active*"
    rubocop:
      patterns:
        - "rubocop*"
    sentry:
      patterns:
        - "sentry-*"
  open-pull-requests-limit: 10
  rebase-strategy: "disabled"
  allow:
    - dependency-type: "all"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
    timezone: Europe/London
  cooldown:
    default-days: 7
  open-pull-requests-limit: 5
  rebase-strategy: "disabled"
  allow:
    - dependency-type: "all"
