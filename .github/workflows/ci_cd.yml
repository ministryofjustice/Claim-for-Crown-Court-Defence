name: CI CD

on:
  push:
  workflow_dispatch:

#   schedule:
#     - cron: "5 8 * * *"
#   workflow_dispatch:
#     inputs:
#       deploy_environment:
#         description: "Environment to deploy to (manual branch deploy path)"
#         required: true
#         type: choice
#         options:
#           - dev
#           - dev-lgfs
#           - staging
#           - api-sandbox
#       git_ref:
#         description: "Git ref to build and deploy"
#         required: true
#         default: "main"
#         type: string
#       run_smoke_test:
#         description: "Run smoke tests before deploy"
#         required: true
#         default: true
#         type: boolean

permissions:
  id-token: write
  contents: read

env:
  RAILS_ENV: test
  TZ: Europe/London
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cccd_test
  GITHUB_TEAM_NAME_SLUG: laa-get-paid
  REPO_NAME: cccd
  # CIRCLE_BRANCH: ${{ github.ref_name }}
  # CIRCLE_SHA1: ${{ github.sha }}
  # CIRCLE_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  IMAGE_NAME: app

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-container:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

  rspec-tests:
    env:
        AWS_REGION: eu-west-2
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_EC2_METADATA_DISABLED: "true"
    if: github.event_name == 'push'
    needs: build-test-container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Wait for DB
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run rspec shard
        shell: bash
        run: |
          mapfile -t FILES < <(find spec -name '*_spec.rb' | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No rspec files found"
            exit 0
          fi

          SHARD_INDEX=$(( ${{ matrix.shard }} - 1 ))
          TOTAL_SHARDS=6
          SELECTED=()
          for i in "${!FILES[@]}"; do
            if (( i % TOTAL_SHARDS == SHARD_INDEX )); then
              SELECTED+=("${FILES[$i]}")
            fi
          done

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No tests selected for shard ${{ matrix.shard }}"
            exit 0
          fi

          bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out /tmp/rspec-${{ matrix.shard }}.xml \
            "${SELECTED[@]}"

      - name: Upload rspec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results-${{ matrix.shard }}
          path: /tmp/rspec-${{ matrix.shard }}.xml

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: tmp/coverage
          if-no-files-found: ignore

  cucumber-tests:
    if: github.event_name == 'push'
    needs: build-test-container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Halt if no cucumber tests to run
        shell: bash
        run: |
          mapfile -t FEATURES < <(find features -name '*.feature' | sort)
          if [ ${#FEATURES[@]} -eq 0 ]; then
            echo "No cucumber feature files found"
            exit 0
          fi

      - name: Wait for DB
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run cucumber shard
        shell: bash
        run: |
          mapfile -t FEATURES < <(find features -name '*.feature' | sort)
          SHARD_INDEX=$(( ${{ matrix.shard }} - 1 ))
          TOTAL_SHARDS=6
          SELECTED=()
          for i in "${!FEATURES[@]}"; do
            if (( i % TOTAL_SHARDS == SHARD_INDEX )); then
              SELECTED+=("${FEATURES[$i]}")
            fi
          done

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No features selected for shard ${{ matrix.shard }}"
            exit 0
          fi

          mkdir -p /tmp/test-results/cucumber
          bundle exec cucumber \
            --format pretty \
            --format junit,fileattribute=true \
            --out /tmp/test-results/cucumber \
            "${SELECTED[@]}"

      - name: Upload cucumber results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-results-${{ matrix.shard }}
          path: /tmp/test-results/cucumber
          if-no-files-found: ignore

      - name: Upload capybara artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-${{ matrix.shard }}
          path: tmp/capybara
          if-no-files-found: ignore

  other-tests:
    if: github.event_name == 'push'
    needs: build-test-container
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Wait for DB
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Run rubocop
        run: bundle exec rubocop

      - name: Run brakeman
        run: bundle exec brakeman

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run jasmine
        run: bundle exec rails jasmine:run

      - name: Run standardJS
        run: yarn run validate:js

      - name: Run stylelint
        run: yarn run validate:scss

    # ----------------------------
# BUILD & PUSH DOCKER IMAGE
# ----------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: [rspec-tests, cucumber-tests]
    permissions:
      id-token: write   # required for AWS OIDC stuff
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build image
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          docker build \
            --file docker/Dockerfile \
            --build-arg DJANGO_SECRET_KEY=docker-build-secret \
            --build-arg VERSION_NUMBER=${{ github.run_number }} \
            --build-arg COMMIT_ID=${{ github.sha }} \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            --build-arg BUILD_TAG=${{ github.ref_name }} \
            -t $IMAGE_NAME .

      - name: Tag + Push
        run: |
          docker tag $IMAGE_NAME $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "Image pushed: $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag $IMAGE_NAME $REGISTRY/$REPOSITORY:app-latest
            docker push $REGISTRY/$REPOSITORY:app-latest
            echo "Image pushed: $REGISTRY/$REPOSITORY:app-latest"
          fi
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: app-${{ github.sha }}
       
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    env:
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure kubectl
        env:
          KUBE_CERT_DEV: ${{ secrets.KUBE_CERT_DEV }}
          KUBE_CLUSTER_DEV: ${{ secrets.KUBE_CLUSTER_DEV }}
          KUBE_TOKEN_DEV: ${{ secrets.KUBE_TOKEN_DEV }}
          KUBE_NAMESPACE_DEV: ${{ secrets.KUBE_NAMESPACE_DEV }}
        run: |
          echo "$KUBE_CERT_DEV" > ca.crt
          kubectl config set-cluster cluster --certificate-authority=ca.crt --server=https://$KUBE_CLUSTER_DEV
          kubectl config set-credentials gha --token=$KUBE_TOKEN_DEV
          kubectl config set-context ctx --cluster=cluster --user=gha --namespace=$KUBE_NAMESPACE_DEV
          kubectl config use-context ctx

      - name: Deploy
        # deploy given image
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG

          kubectl set image -f kubernetes_deploy/live/dev/deployment.yaml app=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl apply \
            -f kubernetes_deploy/live/dev/service.yaml \
            -f kubernetes_deploy/live/dev/ingress.yaml
          kubectl annotate deployment/laa-fee-calculator kubernetes.io/change-cause="$(date +%Y-%m-%dT%H:%M:%S%z) - deploying: $IMAGE via GitHub Actions" --overwrite
          kubectl rollout status deployment/laa-fee-calculator
       
