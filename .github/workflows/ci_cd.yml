  smoke-test-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/CTSKF1158-add-github-actions'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_DB: cccd_smoke_test
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/cccd_smoke_test
      SECRET_KEY_BASE: just-be-present
      IMAGE: ${{ needs.build-and-push.outputs.image }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Pull application image
        run: docker pull "$IMAGE"

      - name: Start application
        run: |
          docker run --detach \
            --name cccd-app \
            --network host \
            --env RAILS_ENV="$RAILS_ENV" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY_BASE="$SECRET_KEY_BASE" \
            --env LIVE1_DB_TASK=none \
            "$IMAGE"

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs cccd-app
          exit 1

      - name: Run smoke test
        run: docker exec cccd-app ./runtests.sh
