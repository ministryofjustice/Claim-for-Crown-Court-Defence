name: Prepare Cucumber database

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TZ: Europe/London
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/cccd_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Start Cucumber database
        shell: bash
        run: |
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          export POSTGRES_PASSWORD
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "PGPASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          docker run --detach --name cucumber-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_USER=postgres --env POSTGRES_DB=cccd_test \
            postgres:13
          for attempt in {1..30}; do
            if docker exec cucumber-postgres pg_isready -U postgres -h 127.0.0.1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cucumber-postgres
          exit 1

      - name: Seed Cucumber database
        run: |
          bin/rails db:schema:load
          bundle exec rails runner 'require Rails.root.join("features/support/seeds"); CucumberSeeds.load!; CucumberSeeds.verify!'

      - name: Dump Cucumber database
        run: |
          mkdir -p tmp
          docker exec cucumber-postgres \
            pg_dump -U postgres --format=custom --no-owner --no-acl cccd_test \
            > tmp/cucumber-database.dump

      - name: Upload Cucumber database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cucumber-database
          path: tmp/cucumber-database.dump
          if-no-files-found: error
          retention-days: 1

      - name: Stop Cucumber database
        if: always()
        run: docker rm --force cucumber-postgres
