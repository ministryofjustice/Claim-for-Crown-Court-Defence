name: Scan docker image
on:
  pull_request:

jobs:
  scan-docker-image:
    runs-on: ubuntu-latest
    name: Scan docker image
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Build docker image
      run: |
        docker build \
          --tag cccd:scan \
          --file docker/Dockerfile .

    - name: Set up Snyk CLI
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

    - name: Authenticate Snyk
      env:
        SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
        SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
      run: |
        snyk auth --auth-type=oauth \
          --client-id="$SNYK_CLIENT_ID" \
          --client-secret="$SNYK_CLIENT_SECRET"

    - name: Scan docker image using snyk
      id: image-scan
      continue-on-error: true
      run: |
        snyk container test cccd:scan \
          --file=docker/Dockerfile \
          --sarif-file-output=snyk.sarif

    - name: Monitor docker image using snyk
      id: image-monitor
      run: |
        snyk container monitor cccd:scan \
          --file=docker/Dockerfile

    - name: Upload result to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        sarif_file: snyk.sarif

    - name: Slack notify failure
      if: ${{ steps.image-scan.outcome == 'failure' }}
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: ${{ steps.image-scan.outcome }}
        SLACK_TITLE: Scanned ${{ github.repository }}
        SLACK_MESSAGE: Docker scan detected vulnerabilities! @chb-devs
        SLACK_LINK_NAMES: true
        SLACK_FOOTER:

    - name: Slack notify success
      if: ${{ steps.image-scan.outcome == 'success' }}
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: ${{ steps.image-scan.outcome }}
        SLACK_TITLE: Scanned ${{ github.repository }}
        SLACK_MESSAGE: Docker scan found no vulnerabilities!
        SLACK_FOOTER:
