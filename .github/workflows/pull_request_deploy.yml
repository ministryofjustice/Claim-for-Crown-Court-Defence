name: Pull request deploy

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build-and-push:
    environment:
      name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECR_REGION: ${{ vars.ECR_REGION }}
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build and push image
        run: .github/build.sh

  deploy-dev:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    env:
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure kubectl
        env:
          KUBE_CERT_DEV: ${{ secrets.KUBE_CERT_DEV }}
          KUBE_CLUSTER_DEV: ${{ secrets.KUBE_CLUSTER_DEV }}
          KUBE_TOKEN_DEV: ${{ secrets.KUBE_TOKEN_DEV }}
          KUBE_NAMESPACE_DEV: ${{ secrets.KUBE_NAMESPACE_DEV }}
        run: |
          echo "$KUBE_CERT_DEV" > ca.crt
          kubectl config set-cluster cluster --certificate-authority=ca.crt --server=https://$KUBE_CLUSTER_DEV
          kubectl config set-credentials gha --token=$KUBE_TOKEN_DEV
          kubectl config set-context ctx --cluster=cluster --user=gha --namespace=$KUBE_NAMESPACE_DEV
          kubectl config use-context ctx

      - name: Deploy to dev
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          kubectl set image -f .k8s/live/dev/deployment.yaml cccd-app=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/live/dev/service.yaml -f .k8s/live/dev/ingress.yaml
          kubectl set image -f .k8s/live/dev/deployment-worker.yaml cccd-worker=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl rollout status deployment/claim-for-crown-court-defence-worker
          kubectl annotate deployment/claim-for-crown-court-defence kubernetes.io/change-cause="$(date +%Y-%m-%dT%H:%M:%S%z) - deploying: $IMAGE via GitHub Actions" --overwrite
          kubectl rollout status deployment/claim-for-crown-court-defence

  deploy-dev-lgfs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev-lgfs
    env:
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure kubectl
        env:
          KUBE_CERT_DEV_LGFS: ${{ secrets.KUBE_CERT_DEV_LGFS }}
          KUBE_CLUSTER_DEV_LGFS: ${{ secrets.KUBE_CLUSTER_DEV_LGFS }}
          KUBE_TOKEN_DEV_LGFS: ${{ secrets.KUBE_TOKEN_DEV_LGFS }}
          KUBE_NAMESPACE_DEV_LGFS: ${{ secrets.KUBE_NAMESPACE_DEV_LGFS }}
        run: |
          echo "$KUBE_CERT_DEV_LGFS" > ca.crt
          kubectl config set-cluster cluster --certificate-authority=ca.crt --server=https://$KUBE_CLUSTER_DEV_LGFS
          kubectl config set-credentials gha --token=$KUBE_TOKEN_DEV_LGFS
          kubectl config set-context ctx --cluster=cluster --user=gha --namespace=$KUBE_NAMESPACE_DEV_LGFS
          kubectl config use-context ctx

      - name: Deploy to dev-lgfs
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          kubectl set image -f .k8s/live/dev-lgfs/deployment.yaml cccd-app=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/live/dev-lgfs/service.yaml -f .k8s/live/dev-lgfs/ingress.yaml
          kubectl annotate deployment/claim-for-crown-court-defence kubernetes.io/change-cause="$(date +%Y-%m-%dT%H:%M:%S%z) - deploying: $IMAGE via GitHub Actions" --overwrite
          kubectl rollout status deployment/claim-for-crown-court-defence

  deploy-api-sandbox:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: api-sandbox
    env:
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure kubectl
        env:
          KUBE_CERT_API_SANDBOX: ${{ secrets.KUBE_CERT_API_SANDBOX }}
          KUBE_CLUSTER_API_SANDBOX: ${{ secrets.KUBE_CLUSTER_API_SANDBOX }}
          KUBE_TOKEN_API_SANDBOX: ${{ secrets.KUBE_TOKEN_API_SANDBOX }}
          KUBE_NAMESPACE_API_SANDBOX: ${{ secrets.KUBE_NAMESPACE_API_SANDBOX }}
        run: |
          echo "$KUBE_CERT_API_SANDBOX" > ca.crt
          kubectl config set-cluster cluster --certificate-authority=ca.crt --server=https://$KUBE_CLUSTER_API_SANDBOX
          kubectl config set-credentials gha --token=$KUBE_TOKEN_API_SANDBOX
          kubectl config set-context ctx --cluster=cluster --user=gha --namespace=$KUBE_NAMESPACE_API_SANDBOX
          kubectl config use-context ctx

      - name: Deploy to api-sandbox
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          kubectl set image -f .k8s/live/api-sandbox/deployment.yaml cccd-app=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/live/api-sandbox/service.yaml -f .k8s/live/api-sandbox/ingress.yaml
          kubectl annotate deployment/claim-for-crown-court-defence kubernetes.io/change-cause="$(date +%Y-%m-%dT%H:%M:%S%z) - deploying: $IMAGE via GitHub Actions" --overwrite
          kubectl rollout status deployment/claim-for-crown-court-defence

  deploy-staging:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure kubectl
        env:
          KUBE_CERT_STAGING: ${{ secrets.KUBE_CERT_STAGING }}
          KUBE_CLUSTER_STAGING: ${{ secrets.KUBE_CLUSTER_STAGING }}
          KUBE_TOKEN_STAGING: ${{ secrets.KUBE_TOKEN_STAGING }}
          KUBE_NAMESPACE_STAGING: ${{ secrets.KUBE_NAMESPACE_STAGING }}
        run: |
          echo "$KUBE_CERT_STAGING" > ca.crt
          kubectl config set-cluster cluster --certificate-authority=ca.crt --server=https://$KUBE_CLUSTER_STAGING
          kubectl config set-credentials gha --token=$KUBE_TOKEN_STAGING
          kubectl config set-context ctx --cluster=cluster --user=gha --namespace=$KUBE_NAMESPACE_STAGING
          kubectl config use-context ctx

      - name: Deploy to staging
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          kubectl set image -f .k8s/live/staging/deployment.yaml cccd-app=$IMAGE --local -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/live/staging/service.yaml -f .k8s/live/staging/ingress.yaml
          kubectl annotate deployment/claim-for-crown-court-defence kubernetes.io/change-cause="$(date +%Y-%m-%dT%H:%M:%S%z) - deploying: $IMAGE via GitHub Actions" --overwrite
          kubectl rollout status deployment/claim-for-crown-court-defence

  check-poc-branch:
    runs-on: ubuntu-latest
    env:
      POC_BRANCH: poc-change-pipeline
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: echo "should_run=$([[ "$HEAD_BRANCH" == "$POC_BRANCH" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  smoke-test-poc:
    if: needs.check-poc-branch.outputs.should_run == 'true'
    needs: [build-and-push, check-poc-branch]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_smoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cccd_smoke_test
      SECRET_KEY_BASE: just-be-present
      ADVOCATE_PASSWORD: just-be-present
      CASE_WORKER_PASSWORD: just-be-present
      ADMIN_PASSWORD: just-be-present
      SUPERADMIN_USERNAME: superadmin@circleci.com
      SUPERADMIN_PASSWORD: just-be-present
      IMAGE: ${{ secrets.ECR_REGISTRY_URL }}/${{ vars.ECR_REPOSITORY }}:app-${{ github.sha }}
      REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: app-${{ github.sha }}
      GRAPE_SWAGGER_ROOT_URL: http://127.0.0.1:3000
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Pull application image
        run: docker pull "$IMAGE"

      - name: Start application container
        env:
          AWS_REGION: ${{ vars.ECR_REGION }}
        run: |
          docker run --detach \
            --name cccd-app \
            --network host \
            --env RAILS_ENV="$RAILS_ENV" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY_BASE="$SECRET_KEY_BASE" \
            --env CASE_WORKER_PASSWORD="$CASE_WORKER_PASSWORD" \
            --env ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --env ADVOCATE_PASSWORD="$ADVOCATE_PASSWORD" \
            --env SUPERADMIN_USERNAME="$SUPERADMIN_USERNAME" \
            --env SUPERADMIN_PASSWORD="$SUPERADMIN_PASSWORD" \
            --env LIVE1_DB_TASK=migrate \
            --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --env AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            --env AWS_REGION="$AWS_REGION" \
            --env GRAPE_SWAGGER_ROOT_URL="$GRAPE_SWAGGER_ROOT_URL" \
            "$IMAGE"

          sleep 15
          docker logs cccd-app

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --silent --show-error --fail \
              -H "Accept: application/json" \
              http://127.0.0.1:3000/ping.json > /dev/null; then
              exit 0
            fi

            if ! docker inspect -f '{{.State.Running}}' cccd-app 2>/dev/null | grep -q true; then
              docker logs cccd-app
              exit 1
            fi

            sleep 2
          done

          docker logs cccd-app
          exit 1

      - name: Verify application started successfully
        run: |
          if curl -s http://127.0.0.1:3000/ping.json > /dev/null 2>&1; then
            echo "Application is responding"
            exit 0
          else
            echo "Application is not responding"
            docker logs cccd-app | tail -50
            exit 1
          fi

      - name: Run smoke tests
        run: |
          echo "Testing Redis connection..."
          docker exec cccd-app redis-cli -u redis://127.0.0.1:6379/0 ping

          echo "Testing Puma connectivity..."
          docker exec cccd-app curl -s http://127.0.0.1:3000/ping.json

          docker exec cccd-app bash -e -c "
            bundle exec rake db:migrate
            bundle exec rake db:seed
            bundle exec rake api:smoke_test
          "

          echo "Capturing full container logs..."
          docker logs cccd-app | tail -100