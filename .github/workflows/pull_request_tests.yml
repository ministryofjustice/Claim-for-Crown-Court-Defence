name: Pull request tests

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  RAILS_ENV: test
  TZ: Europe/London
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cccd_test

jobs:
  rspec-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Wait for database
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run RSpec shard
        shell: bash
        run: |
          mapfile -t FILES < <(find spec -name '*_spec.rb' | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No RSpec files found"
            exit 0
          fi

          SHARD_INDEX=$(( ${{ matrix.shard }} - 1 ))
          TOTAL_SHARDS=6
          SELECTED=()
          for index in "${!FILES[@]}"; do
            if (( index % TOTAL_SHARDS == SHARD_INDEX )); then
              SELECTED+=("${FILES[$index]}")
            fi
          done

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No tests selected for shard ${{ matrix.shard }}"
            exit 0
          fi

          bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out /tmp/rspec-${{ matrix.shard }}.xml \
            "${SELECTED[@]}"

      - name: Upload RSpec results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rspec-results-${{ matrix.shard }}
          path: /tmp/rspec-${{ matrix.shard }}.xml

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.shard }}
          path: tmp/coverage
          if-no-files-found: ignore

  cucumber-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Wait for database
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run Cucumber shard
        shell: bash
        run: |
          mapfile -t FEATURES < <(find features -name '*.feature' | sort)
          if [ ${#FEATURES[@]} -eq 0 ]; then
            echo "No Cucumber feature files found"
            exit 0
          fi

          SHARD_INDEX=$(( ${{ matrix.shard }} - 1 ))
          TOTAL_SHARDS=6
          SELECTED=()
          for index in "${!FEATURES[@]}"; do
            if (( index % TOTAL_SHARDS == SHARD_INDEX )); then
              SELECTED+=("${FEATURES[$index]}")
            fi
          done

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No features selected for shard ${{ matrix.shard }}"
            exit 0
          fi

          mkdir -p /tmp/test-results/cucumber
          bundle exec cucumber \
            --format pretty \
            --format junit,fileattribute=true \
            --out /tmp/test-results/cucumber \
            "${SELECTED[@]}"

      - name: Upload Cucumber results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cucumber-results-${{ matrix.shard }}
          path: /tmp/test-results/cucumber
          if-no-files-found: ignore

      - name: Upload Capybara artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: capybara-${{ matrix.shard }}
          path: tmp/capybara
          if-no-files-found: ignore

  other-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4

      - name: Wait for database
        run: until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done

      - name: Database setup
        run: bin/rails db:schema:load --trace

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run Brakeman
        run: bundle exec brakeman

      - name: Run Jasmine
        run: bundle exec rails jasmine:run

      - name: Run StandardJS
        run: yarn run validate:js

      - name: Run Stylelint
        run: yarn run validate:scss