name: Retry failed RSpec and Cucumber jobs
# Runs after the tests complete and retries flaky test shards.
#  Long-term goal should always be to fix the tests
on:
  workflow_run:
    workflows: ["CI CD"]
    types: [completed]

jobs:
  check-test-jobs:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      test-status: ${{ steps.check-tests.outputs.status }}
      has-failures: ${{ steps.check-tests.outputs.has-failures }}
    steps:
      - name: Check if only test jobs have completed
        id: check-tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Get all jobs and their statuses
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | {name: .name, conclusion: .conclusion, status: .status}')
          
          # Check if all test jobs are completed (not in progress)
          TEST_JOBS_COMPLETED=$(echo "$JOBS" | jq -s '[.[] | select(.name | startswith("rspec-tests") or startswith("cucumber-tests") or . == "other-tests")] | all(.conclusion != null)')
          
          # Check if there are any failed test jobs
          HAS_FAILURES=$(echo "$JOBS" | jq -s '[.[] | select(.name | startswith("rspec-tests") or startswith("cucumber-tests") or . == "other-tests")] | any(.conclusion == "failure")')
          
          echo "status=$TEST_JOBS_COMPLETED" >> $GITHUB_OUTPUT
          echo "has-failures=$HAS_FAILURES" >> $GITHUB_OUTPUT

  retry-rspec-cucumber-tests:
    needs: check-test-jobs
    if: needs.check-test-jobs.outputs.test-status == 'true' && needs.check-test-jobs.outputs.has-failures == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed RSpec and Cucumber jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOB_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | select(
            (.name | startswith("rspec-tests")) or
            (.name | startswith("cucumber-tests")) or
            .name == "other-tests"
            ) | .id')

          if [ -z "$FAILED_JOB_IDS" ]; then
            echo "No failed RSpec or Cucumber jobs to retry"
            exit 0
          fi

          for JOB_ID in $FAILED_JOB_IDS; do
            echo "Re-running job $JOB_ID"
            gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/rerun" -X POST
          done