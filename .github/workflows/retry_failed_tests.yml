name: Retry failed RSpec and Cucumber jobs
on:
  workflow_run:
    workflows: ["CI CD"]
    types: [requested]
    branches: [CTSKF1158-add-github-actions]

jobs:
  wait-for-tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for test jobs to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Poll until test jobs are complete
          for attempt in {1..360}; do  # 30 minutes max
            TEST_JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.name | startswith("rspec-tests") or startswith("cucumber-tests") or .name == "other-tests")]')
            
            # Check if all test jobs have conclusions (completed)
            COMPLETED=$(echo "$TEST_JOBS" | jq 'all(.conclusion != null)')
            
            if [ "$COMPLETED" = "true" ]; then
              echo "All test jobs completed"
              exit 0
            fi
            
            echo "Waiting for tests to complete... (attempt $attempt)"
            sleep 5
          done
          
          echo "Timeout waiting for test jobs"
          exit 1

  retry-rspec-cucumber-tests:
    needs: wait-for-tests
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed RSpec and Cucumber jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          FAILED_JOB_IDS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | select(
            (.name | startswith("rspec-tests")) or
            (.name | startswith("cucumber-tests")) or
            .name == "other-tests"
            ) | .id')

          if [ -z "$FAILED_JOB_IDS" ]; then
            echo "No failed RSpec or Cucumber jobs to retry"
            exit 0
          fi

          for JOB_ID in $FAILED_JOB_IDS; do
            echo "Re-running job $JOB_ID"
            gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/rerun" -X POST
          done