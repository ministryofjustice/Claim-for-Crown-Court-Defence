jobs:
  image_scan:
    name: Run SaST tooling
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/sast.yml@665b123096f599d105d3b7ae19bd4b81bcabd99a # main as of 15/10/2026
    permissions:
      actions: read
      id-token: write
      contents: read
      security-events: write
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}