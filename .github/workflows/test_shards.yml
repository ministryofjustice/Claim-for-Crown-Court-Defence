name: Prepare test shards

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TZ: Europe/London
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download historical timings
        id: download-timings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TIMINGS_DIRECTORY=tmp/no-test-timings
          if RUN_ID=$(gh run list --workflow ci_cd.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty'); then
            if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" \
              --pattern 'rspec-results-*' --pattern 'cucumber-results-*' \
              --dir tmp/test-timings; then
              TIMINGS_DIRECTORY=tmp/test-timings
            else
              echo "::warning::No historical test reports available; balancing shards by file size"
            fi
          else
            echo "::warning::Could not look up historical timings; balancing shards by file size"
          fi
          echo "directory=$TIMINGS_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare shards
        env:
          TIMINGS_DIRECTORY: ${{ steps.download-timings.outputs.directory }}
        run: bundle exec ruby script/test_shards.rb "$TIMINGS_DIRECTORY" tmp/test-shards 6

      - name: Upload shard plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-shards
          path: tmp/test-shards
          if-no-files-found: error

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --ignore-scripts --frozen-lockfile

      - name: Precompile test assets
        run: bundle exec rails assets:precompile

      - name: Archive test assets
        run: tar -cf tmp/test-assets.tar app/assets/builds public/assets

      - name: Upload test assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-assets
          path: tmp/test-assets.tar
          if-no-files-found: error
          retention-days: 1